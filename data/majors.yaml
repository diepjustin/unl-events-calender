# Major -> org/tag mapping used to score and rank events for a student.
# This is the file an editor (not a programmer) should be editing.
#
# HOW SCORING USES THIS FILE (see index.html's `scoreEvent`):
#   - unit_slugs: if an event was pulled from one of these units' own
#     federated calendars (events.unl.edu/<slug>/ -- see UNIT_SLUGS in
#     fetch_events.py), the event gets +3 with the reason "Posted under
#     {label}'s calendar". This is the strongest, most reliable signal --
#     prefer it over org_contains where a unit slug exists for that major.
#   - org_contains: only checked if unit_slugs didn't already match (no
#     double-counting the same "this is really from this department"
#     signal twice). If an event's organizer/host name contains any of
#     these strings (case-insensitive), the event gets +3 with the reason
#     "From {label}'s usual org list".
#   - tags: if any of these words show up in the event's category, title,
#     or description, the event gets +2 with the reason "Common for
#     {label} students".
#
# HOW TO ADD A MAJOR:
#   1. Copy a block below, change the key (kebab-case) and the label.
#   2. For org_contains: either reuse a college anchor (see "COLLEGE
#      ANCHORS" below -- most majors do this) or, if you've found a more
#      specific organizer name for that exact major on events.unl.edu, add
#      it directly as its own string. Exact names work best -- "Department
#      of Mathematics", not "Math".
#   3. For tags: a handful of words a student in that major would recognize.
#      Keep them lowercase. These also get matched against event
#      descriptions, so avoid very common single words that would over-match
#      (e.g. don't add "students" as a tag -- it's in almost every event).
#   4. Run `python3 scripts/fetch_events.py` and check whether events you
#      recognize as relevant to that major are showing up ranked higher.
#
# HOW TO REMOVE A MAJOR: delete its block.
#
# COLLEGE ANCHORS: UNL has ~140 undergraduate majors (source: UNL's own
# catalog, catalog.unl.edu/undergraduate/majors/, checked 2026-09-04 --
# excludes minors and certificates, which aren't majors) and most of them
# share a college. Retyping "College of Engineering" fifteen times would
# make this file unmaintainable, so each college's org_contains list is
# defined ONCE below under `_colleges`, tagged with a `&name` (an "anchor"),
# and each major re-uses it with `*name` (an "alias") plus its own
# major-specific extras. You do NOT need to understand this to add an
# ordinary major -- just copy an existing block, including its `<<: *xxx`
# line, and change the alias to whichever college fits. The `_colleges` key
# itself is not a major -- fetch_events.py skips any top-level key starting
# with `_` when building majors.json, so it never shows up as a selectable
# major on the page.
#
# CONFIDENCE LEVELS: entries marked "observed" were confirmed against a live
# pull of events.unl.edu's or Engage's feed during this project's build.
# Everything else uses UNL's official college/department names but hasn't
# been checked against a real event yet -- expect to retune tags and
# org_contains as you see how each major actually performs.
#
# UNIT_SLUGS: events.unl.edu is federated -- each college/department also
# has its own calendar at events.unl.edu/<slug>/. fetch_events.py fetches
# each slug in its own UNIT_SLUGS list, sees which event UIDs that unit
# claims, and tags matching events with `units: [<slug>, ...]` in
# events.json. This file's `unit_slugs` field is what a major matches
# that tag against. Only ~23 units are known (fetch_events.py's own
# comment on UNIT_SLUGS explains why this can't be a complete list --
# there's no public directory of them), so most majors still rely on
# org_contains/tags alone. If you find a department has its own calendar
# events.unl.edu/<slug>/ that isn't in UNIT_SLUGS yet, add the slug there
# AND set unit_slugs here for the matching major(s).

_colleges:
  casnr: &casnr_org
    - "College of Agricultural Sciences & Natural Resources"
    - "College of Agricultural Sciences and Natural Resources"
    - "CASNR"
    - "PlantNebraska"                # observed
    - "Nebraska Statewide Arboretum" # observed
  architecture: &architecture_org
    - "College of Architecture"
  cas: &cas_org
    - "College of Arts & Sciences"
    - "College of Arts and Sciences"
  business: &business_org
    - "College of Business"
    - "Business Career Center"       # observed
    - "Center for Entrepreneurship"  # observed
  cehs: &cehs_org
    - "College of Education & Human Sciences"
    - "College of Education and Human Sciences"
  engineering: &engineering_org
    - "College of Engineering"
  fpa: &fpa_org
    - "Hixson-Lied College of Fine & Performing Arts"
    - "Hixson-Lied College of Fine and Performing Arts"  # observed (site uses "and" in practice)
    - "Sheldon Museum of Art"        # observed
    - "Great Plains Art Museum"      # observed
  cojmc: &cojmc_org
    - "College of Journalism & Mass Communications"
    - "College of Journalism and Mass Communications"
    - "CoJMC"
    - "Daily Nebraskan"
  pacs: &pacs_org
    - "College of Public Affairs & Community Service"
  law: &law_org
    - "College of Law"
  explore: &explore_org
    - "Explore Center"    # observed
    - "Career Services"   # observed

# unit_slugs anchors -- see the UNIT_SLUGS comment above. Confirmed live as
# of 2026-09-05; no anchor exists for a college without a confirmed
# college-wide unit slug (fpa, pacs, cas, explore) -- some of those colleges
# do have DEPARTMENT-level units confirmed instead (english, psychology,
# etc.), set directly on the specific major below rather than here.
_college_units:
  casnr: &casnr_units [casnr]
  architecture: &architecture_units [architecture]
  business: &business_units [cba]
  cehs: &cehs_units [cehs]
  engineering: &engineering_units [engineering]
  cojmc: &cojmc_units [cojmc]
  law: &law_units [law]

